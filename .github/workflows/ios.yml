name: iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event_name == 'workflow_dispatch' && format('full-{0}', github.run_id) || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 120
    name: Build and test (${{ matrix.device }})
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["compact","phone","large","tablet","tablet-landscape","large-tablet"]' || '["phone","tablet"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project and icon generators
        run: brew install xcodegen librsvg
      - name: Restore Swift package sources
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v2-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-v2-
            ${{ runner.os }}-${{ runner.arch }}-spm-
      - name: Identify Xcode build cache
        id: xcode-cache
        shell: bash
        run: |
          XCODE_BUILD=$(xcodebuild -version | tr '\n' '-' | tr -cd '[:alnum:].-')
          SIM_SDK_BUILD=$(xcrun --sdk iphonesimulator --show-sdk-build-version)
          DEVICE_SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          echo "identity=$XCODE_BUILD-$SIM_SDK_BUILD-$DEVICE_SDK_BUILD" >> "$GITHUB_OUTPUT"
      - name: Cache compiled dependencies and build intermediates
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
            DerivedData/SDKStatCaches.noindex
          key: ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.identity }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-${{ matrix.device }}-${{ github.sha }}
          restore-keys: |
            ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.identity }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-${{ matrix.device }}-
            ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.identity }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-
      - name: Generate and validate source inputs
        run: |
          python3 scripts/generate.py
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/lint.py
          xcodegen generate
      - name: Select phone or tablet simulator
        run: |
          python3 scripts/device-matrix.py '${{ matrix.device }}'
      - name: Compile app and native test bundles
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project SpaceWorks.xcodeproj -scheme SpaceWorks -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages -skipPackagePluginValidation "SPACEWORKS_TEST_PROFILE=$DEVICE_PROFILE" ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tee build.log
      - name: Inspect actual built Debug bundle metadata
        run: |
          python3 - <<'PY'
          import json, os, pathlib, plistlib, subprocess
          app = pathlib.Path('DerivedData/Build/Products/Debug-iphonesimulator/SpaceWorks.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          required = {'UIInterfaceOrientationPortrait', 'UIInterfaceOrientationLandscapeLeft', 'UIInterfaceOrientationLandscapeRight'}
          orientations = {key: value for key, value in info.items() if key.startswith('UISupportedInterfaceOrientations')}
          scene = info.get('UIApplicationSceneManifest', {})
          validations = {
              'source_matches_checkout': source == os.environ['GITHUB_SHA'],
              'single_scene_explicit': scene.get('UIApplicationSupportsMultipleScenes') is False,
              'phone_and_tablet_families': set(info.get('UIDeviceFamily', [])) == {1, 2},
              'phone_orientations': required <= set(info.get('UISupportedInterfaceOrientations~iphone', info.get('UISupportedInterfaceOrientations', []))),
              'tablet_orientations': required <= set(info.get('UISupportedInterfaceOrientations~ipad', []))}
          report = {'kind': 'canonical-built-debug-metadata', 'source_sha': source,
                    'profile': os.environ['DEVICE_PROFILE'], 'bundle_id': info.get('CFBundleIdentifier'),
                    'sdk': info.get('DTSDKName'), 'device_families': info.get('UIDeviceFamily'),
                    'fonts': info.get('UIAppFonts', []), 'scene_manifest': scene,
                    'orientations': orientations, 'validations': validations}
          pathlib.Path('validation-debug-bundle.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          assert all(validations.values()), validations
          PY
      - name: Run native state and API tests
        timeout-minutes: 10
        run: |
          set -o pipefail
          xcodebuild test-without-building -project SpaceWorks.xcodeproj -scheme SpaceWorks -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages -resultBundlePath NativeTestResults.xcresult -skipPackagePluginValidation "SPACEWORKS_TEST_PROFILE=$DEVICE_PROFILE" ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -only-testing:SpaceWorksTests | tee -a build.log
      - name: Run native UI journeys
        run: |
          set -o pipefail
          xcodebuild test-without-building -project SpaceWorks.xcodeproj -scheme SpaceWorks -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages -resultBundlePath TestResults.xcresult -skipPackagePluginValidation "SPACEWORKS_TEST_PROFILE=$DEVICE_PROFILE" ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -only-testing:SpaceWorksUITests | tee -a build.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
          fi
      - name: Compile unsigned Release for a physical iOS device
        if: success() && matrix.device == 'phone'
        run: |
          set -o pipefail
          xcodebuild build -project SpaceWorks.xcodeproj -scheme SpaceWorks -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee release-build.log
      - name: Audit unsigned Release bundle resources
        if: success() && matrix.device == 'phone'
        run: python3 scripts/audit_bundle.py DerivedData/Build/Products/Release-iphoneos/SpaceWorks.app
      - name: Collect read-only native orientation diagnostics
        if: always()
        run: |
          if [ -n "$SIMULATOR_ID" ]; then
            xcrun simctl spawn "$SIMULATOR_ID" log show --last 120m --style compact --predicate 'subsystem == "org.spaceworks.orientation-diagnostics" AND category == "orientation"' > orientation-system.log 2>&1 || true
          fi
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ matrix.device }}
          path: |
            NativeTestResults.xcresult
            TestResults.xcresult
            TestAttachments
            build.log
            release-build.log
            validation-device.json
            validation-bundle.json
            validation-debug-bundle.json
            orientation-system.log
            DerivedData/Build/Intermediates.noindex/BuildToolPluginIntermediates/**/GeneratedSources/*.swift
            SpaceWorks.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7
      - name: Save Swift package sources after validation
        if: always() && !cancelled() && steps.package-cache.outputs.cache-primary-key != '' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: SourcePackages
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - name: Save compiler cache after validation
        if: always() && !cancelled() && steps.compiled-cache.outputs.cache-primary-key != '' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
            DerivedData/SDKStatCaches.noindex
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}

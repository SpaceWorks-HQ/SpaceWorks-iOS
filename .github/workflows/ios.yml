name: iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    name: Build and test (${{ matrix.device }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["compact","phone","large","tablet","tablet-landscape","large-tablet"]' || '["phone","tablet"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install project and icon generators
        run: brew install xcodegen librsvg
      - name: Generate and validate source inputs
        run: |
          python3 scripts/generate.py
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/lint.py
          xcodegen generate
      - name: Select phone or tablet simulator
        run: |
          python3 scripts/device-matrix.py '${{ matrix.device }}'
      - name: Compile and test on simulator
        run: |
          set -o pipefail
          xcodebuild test -project SpaceWorks.xcodeproj -scheme SpaceWorks -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -resultBundlePath TestResults.xcresult -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee build.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
          fi
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ matrix.device }}
          path: |
            TestResults.xcresult
            TestAttachments
            build.log
            validation-device.json
            DerivedData/Build/Intermediates.noindex/BuildToolPluginIntermediates/**/GeneratedSources/*.swift
            SpaceWorks.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7

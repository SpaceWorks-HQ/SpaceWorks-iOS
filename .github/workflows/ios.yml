name: iOS
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.event_name == 'workflow_dispatch' && format('full-{0}', github.run_id) || format('{0}-{1}', github.event.pull_request.head.repo.full_name || github.repository, github.head_ref || github.ref_name) }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    timeout-minutes: 120
    name: Build and test (${{ matrix.device }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        device: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["compact","phone","large","tablet","tablet-landscape","large-tablet"]' || '["phone","tablet"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify pinned Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install project and icon generators
        run: brew install xcodegen librsvg
      - name: Restore Swift package sources
        id: package-cache
        uses: actions/cache/restore@v4
        with:
          path: SourcePackages
          key: ${{ runner.os }}-${{ runner.arch }}-spm-v2-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-spm-v2-
            ${{ runner.os }}-${{ runner.arch }}-spm-
      - name: Identify Xcode build cache
        id: xcode-cache
        shell: bash
        run: |
          XCODE_BUILD=$(xcodebuild -version | tr '\n' '-' | tr -cd '[:alnum:].-')
          SIM_SDK_BUILD=$(xcrun --sdk iphonesimulator --show-sdk-build-version)
          DEVICE_SDK_BUILD=$(xcrun --sdk iphoneos --show-sdk-build-version)
          echo "identity=$XCODE_BUILD-$SIM_SDK_BUILD-$DEVICE_SDK_BUILD" >> "$GITHUB_OUTPUT"
      - name: Cache compiled dependencies and build intermediates
        id: compiled-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
            DerivedData/SDKStatCaches.noindex
          key: ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.identity }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-${{ matrix.device }}-${{ github.sha }}
          restore-keys: |
            ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.identity }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-${{ matrix.device }}-
            ios-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.identity }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}-
      - name: Generate and validate source inputs
        run: |
          python3 scripts/generate.py
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/lint.py
          xcodegen generate
      - name: Select phone or tablet simulator
        run: |
          python3 scripts/device-matrix.py '${{ matrix.device }}'
      - name: Compile and test on simulator
        run: |
          set -o pipefail
          xcodebuild test -project SpaceWorks.xcodeproj -scheme SpaceWorks -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages -resultBundlePath TestResults.xcresult -skipPackagePluginValidation ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= | tee build.log
      - name: Export UI screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments || true
          fi
      - name: Compile unsigned Release for a physical iOS device
        if: success() && matrix.device == 'phone'
        run: |
          set -o pipefail
          xcodebuild build -project SpaceWorks.xcodeproj -scheme SpaceWorks -configuration Release -destination 'generic/platform=iOS' -derivedDataPath DerivedData -clonedSourcePackagesDirPath SourcePackages -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO | tee release-build.log
      - name: Archive validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-validation-${{ matrix.device }}
          path: |
            TestResults.xcresult
            TestAttachments
            build.log
            release-build.log
            validation-device.json
            DerivedData/Build/Intermediates.noindex/BuildToolPluginIntermediates/**/GeneratedSources/*.swift
            SpaceWorks.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          retention-days: 7
      - name: Save Swift package sources after validation
        if: always() && !cancelled() && steps.package-cache.outputs.cache-primary-key != '' && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: SourcePackages
          key: ${{ steps.package-cache.outputs.cache-primary-key }}
      - name: Save compiler cache after validation
        if: always() && !cancelled() && steps.compiled-cache.outputs.cache-primary-key != '' && steps.compiled-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            DerivedData/Build
            DerivedData/ModuleCache.noindex
            DerivedData/SDKStatCaches.noindex
          key: ${{ steps.compiled-cache.outputs.cache-primary-key }}
